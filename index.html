<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Contact Form</title>
  </head>
  <body>
    <div id="toast" class="toast toast--hidden">
      <div class="toast__header">
        <img
          src="./assets/images/icon-success-check.svg"
          alt="toast check"
          class="toast__icon"
        />
        <span class="toast__status">Message Sent!</span>
      </div>
      <p class="toast__message">
        Thanks for completing the form. We'll be in touch soon!
      </p>
    </div>
    <main class="contact-form">
      <header>
        <h1 class="contact-form__title">Contact Us</h1>
      </header>
      <form class="contact-form__fields" novalidate>
        <!--Name Input-->
        <fieldset class="contact-form__group contact-form__group--responsive">
          <div class="form-group">
            <label for="first-name" class="form-group__label"
              >First Name
              <span class="form-group__label--required">*</span></label
            >
            <input
              type="text"
              name="first-name"
              id="first-name"
              aria-required="true"
              class="form-group__input"
            />
            <span class="form-group__error" data-for="first-name"></span>
          </div>
          <div class="form-group">
            <label for="last-name" class="form-group__label"
              >Last Name
              <span class="form-group__label--required">*</span></label
            >
            <input
              type="text"
              name="last-name"
              id="last-name"
              aria-required="true"
              class="form-group__input"
            />
            <span class="form-group__error" data-for="last-name"></span>
          </div>
        </fieldset>

        <!--Email Input-->
        <fieldset class="form-group">
          <label for="email" class="form-group__label"
            >Email Address
            <span class="form-group__label--required">*</span></label
          >
          <input
            type="email"
            name="email"
            id="email"
            aria-required="true"
            class="form-group__input"
          />
          <span class="form-group__error" data-for="email"></span>
        </fieldset>

        <!--Query Type-->
        <fieldset class="form-group">
          <div class="form-group__label">
            Query Type <span class="form-group__label--required">*</span>
          </div>
          <div class="form-group--responsive">
            <div class="form-group__query-option">
              <input
                type="radio"
                name="query-type"
                id="option-1"
                value="General"
                aria-required="true"
                class="form-group__radio"
              />
              <label for="option-1" class="form-group__radio-label"
                >General Enquiry</label
              >
            </div>
            <div class="form-group__query-option">
              <input
                type="radio"
                name="query-type"
                id="option-2"
                value="Support"
                aria-required="true"
                class="form-group__radio"
              />
              <label for="option-2" class="form-group__radio-label"
                >Support Request</label
              >
            </div>
          </div>
          <span class="form-group__error" data-for="query-type"></span>
        </fieldset>

        <!--Message Input-->
        <fieldset class="form-group">
          <label for="message" class="form-group__label"
            >Message <span class="form-group__label--required">*</span></label
          >
          <textarea
            name="message"
            id="message"
            aria-required="true"
            class="form-group__textarea"
          ></textarea>
          <span class="form-group__error" data-for="message"></span>
        </fieldset>

        <!--Agree to requirement-->
        <fieldset class="form-group">
          <div class="consent-accept">
            <input
              type="checkbox"
              id="consent"
              name="consent"
              aria-required="true"
              class="form-group__checkbox"
            />
            <label for="consent" class="form-group__label"
              >I consent to being contacted by the team
              <span class="form-group__label--required">*</span></label
            >
          </div>
          <span class="form-group__error" data-for="consent"></span>
        </fieldset>

        <!--Submit Button-->
        <button type="submit" id="submit" class="contact-form__button">
          Submit
        </button>
      </form>
    </main>
    <script src="index.js"></script>
  </body>
</html>
